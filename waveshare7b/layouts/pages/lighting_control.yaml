# lighting_control.yaml - Lighting Controls Page
# 1024x600 | 8 light toggle cards (2x4 grid) + all-on/all-off quick actions

# ── Header ────────────────────────────────────────────────────────────────────
- obj:
    width: 1024
    height: 70
    bg_color: 0x1C1C1E
    border_width: 0
    align: TOP_MID
    widgets:
      - label:
          text: "LIGHTING CONTROL"
          text_font: roboto_28
          text_color: 0xFFFFFF
          align: CENTER

# ── Content Area (8 light cards + quick actions) ─────────────────────────────
